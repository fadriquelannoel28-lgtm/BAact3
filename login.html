<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - EcoCoins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
      label.error {
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 0.25rem;
        display: block;
        font-weight: 500;
      }
      input.error {
        border-color: #dc3545 !important;
      }
    </style>
  </head>
  <body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success border-bottom border-light">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">EcoCoins</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#hero">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#how-it-works">How It Works</a></li>
            <li class="nav-item"><a class="nav-link active fw-bold" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5 my-auto">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-success shadow-sm bg-white">
            <div class="card-header bg-success text-white text-center py-3">
              <h4 class="fw-bold mb-0">EcoCoins Account Login</h4>
            </div>
            <div class="card-body p-4">


              <div id="loginAlert"></div>


              <form action="#" id="myForm" method="POST" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label text-dark fw-semibold">Email Address</label>
                  <input type="email" class="form-control border-success" id="email" name="email" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label text-dark fw-semibold">Password</label>
                  <input type="password" class="form-control border-success" id="password" name="password" placeholder="Enter your password">
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input border-success" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label text-secondary small" for="remember">
                      Remember me
                    </label>
                  </div>
                  <a href="#" class="text-success small text-decoration-none">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">Log In</button>
              </form>


            </div>
            <div class="card-footer bg-light border-top border-success text-center py-3">
              <span class="text-secondary small">Don't have an EcoCoins account yet? </span>
              <a href="register.html" class="text-success fw-bold text-decoration-none">Register Here</a>
            </div>
          </div>
          <div class="text-center mt-3">
            <a href="index.html" class="text-secondary small text-decoration-none">&larr; Back to Main Proposal</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top border-success text-center py-3">
      <div class="container">
        <p class="text-muted small mb-0">&copy; EcoCoins Project Proposal. Lipa City Malls Recycling Reward System.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      $(document).ready(function () {
        $("#myForm").validate({
          rules: {
            email: {
              required: true,
              email: true
            },
            password: {
              required: true
            }
          },
          messages: {
            email: {
              required: "Please enter your email",
              email: "Please enter a valid email address"
            },
            password: {
              required: "Please enter your password"
            }
          },
          submitHandler: function (form) {
            var email = $("#email").val().trim().toLowerCase();
            var password = $("#password").val();
            var alertBox = $("#loginAlert");

            var defaultEmail = "admin@ecocoins.ph";
            var defaultPassword = "admin123";

            var users = JSON.parse(localStorage.getItem("ecoCoinsUsers") || "[]");
            var user = null;

            if (email === defaultEmail && password === defaultPassword) {
              user = { name: "Admin", email: email };
            } else {
              for (var i = 0; i < users.length; i++) {
                if (users[i].email.toLowerCase() === email && users[i].password === password) {
                  user = { name: users[i].firstName + " " + users[i].lastName, email: users[i].email };
                  break;
                }
              }
            }

            if (user) {
              localStorage.setItem("ecoCoinsCurrentUser", JSON.stringify(user));
              alertBox.html('<div class="alert alert-success py-2 small">Login successful! Redirecting...</div>');
              setTimeout(function () {
                window.location.href = "index.html";
              }, 1000);
            } else {
              alertBox.html('<div class="alert alert-danger py-2 small">Invalid email or password.</div>');
            }

            return false;
          }
        });
      });
    </script>
  </body>
</html>
