<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - EcoCoins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success border-bottom border-light">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">EcoCoins</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#hero">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#how-it-works">How It Works</a></li>
            <li class="nav-item"><a class="nav-link active fw-bold" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5 my-auto">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-success shadow-sm bg-white">
            <div class="card-header bg-success text-white text-center py-3">
              <h4 class="fw-bold mb-0">EcoCoins Account Login</h4>
            </div>
            <div class="card-body p-4">
              <form action="#" method="POST">
                <div class="mb-3">
                  <label for="email" class="form-label text-dark fw-semibold">Email Address</label>
                  <input type="email" class="form-control border-success" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label text-dark fw-semibold">Password</label>
                  <input type="password" class="form-control border-success" id="password" placeholder="Enter your password" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input border-success" type="checkbox" id="remember">
                    <label class="form-check-label text-secondary small" for="remember">
                      Remember me
                    </label>
                  </div>
                  <a href="#" class="text-success small text-decoration-none">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">Log In</button>
              </form>
            </div>
            <div class="card-footer bg-light border-top border-success text-center py-3">
              <span class="text-secondary small">Don't have an EcoCoins account yet? </span>
              <a href="register.html" class="text-success fw-bold text-decoration-none">Register Here</a>
            </div>
          </div>
          <div class="text-center mt-3">
            <a href="index.html" class="text-secondary small text-decoration-none">&larr; Back to Main Proposal</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top border-success text-center py-3">
      <div class="container">
        <p class="text-muted small mb-0">&copy; EcoCoins Project Proposal. Lipa City Malls Recycling Reward System.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
