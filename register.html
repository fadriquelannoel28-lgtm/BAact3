<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - EcoCoins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
      label.error {
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 0.25rem;
        display: block;
        font-weight: 500;
      }
      input.error {
        border-color: #dc3545 !important;
      }
    </style>
  </head>
  <body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success border-bottom border-light">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">EcoCoins</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#hero">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#how-it-works">How It Works</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link active fw-bold" href="register.html">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5 my-auto">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card border-success shadow-sm bg-white">
            <div class="card-header bg-success text-white text-center py-3">
              <h4 class="fw-bold mb-0">Create an EcoCoins Account</h4>
            </div>
            <div class="card-body p-4">
              <div id="registerAlert"></div>



              <form action="#" id="registerForm" method="POST" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="firstName" class="form-label text-dark fw-semibold">First Name</label>
                    <input type="text" class="form-control border-success" id="firstName" name="firstName" placeholder="Juan">
                  </div>
                  <div class="col-md-6">
                    <label for="lastName" class="form-label text-dark fw-semibold">Last Name</label>
                    <input type="text" class="form-control border-success" id="lastName" name="lastName" placeholder="Dela Cruz">
                  </div>
                  <div class="col-12">
                    <label for="email" class="form-label text-dark fw-semibold">Email Address</label>
                    <input type="email" class="form-control border-success" id="email" name="email" placeholder="juan@example.com">
                  </div>
                  <div class="col-md-6">
                    <label for="password" class="form-label text-dark fw-semibold">Password</label>
                    <input type="password" class="form-control border-success" id="password" name="password" placeholder="Create password">
                  </div>
                  <div class="col-md-6">
                    <label for="confirmPassword" class="form-label text-dark fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control border-success" id="confirmPassword" name="confirmPassword" placeholder="Confirm password">
                  </div>
                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input border-success" type="checkbox" id="terms" name="terms">
                      <label class="form-check-label text-secondary small" for="terms">
                        I agree to participate in proper waste disposal guidelines.
                      </label>
                    </div>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">Create Account</button>
                  </div>
                </div>
              </form>



            </div>
            <div class="card-footer bg-light border-top border-success text-center py-3">
              <span class="text-secondary small">Already registered? </span>
              <a href="login.html" class="text-success fw-bold text-decoration-none">Log In Here</a>
            </div>
          </div>
          <div class="text-center mt-3">
            <a href="index.html" class="text-secondary small text-decoration-none">&larr; Back to Main Proposal</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top border-success text-center py-3">
      <div class="container">
        <p class="text-muted small mb-0">&copy; EcoCoins Project Proposal. Lipa City Malls Recycling Reward System.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      $(document).ready(function () {
        $("#registerForm").validate({
          rules: {
            firstName: {
              required: true,
              minlength: 2
            },
            lastName: {
              required: true,
              minlength: 2
            },
            email: {
              required: true,
              email: true
            },
            password: {
              required: true,
              minlength: 6
            },
            confirmPassword: {
              required: true,
              equalTo: "#password"
            },
            terms: {
              required: true
            }
          },

          messages: {
            firstName: {
              required: "First name is required.",
              minlength: "First name must have at least 2 characters."
            },
            lastName: {
              required: "Last name is required.",
              minlength: "Last name must have at least 2 characters."
            },
            email: {
              required: "Email address is required.",
              email: "Please enter a valid email address (e.g. name@example.com)."
            },
            password: {
              required: "Please provide a password.",
              minlength: "Password must be at least 6 characters long."
            },
            confirmPassword: {
              required: "Please confirm your password.",
              equalTo: "Passwords do not match."
            },
            terms: {
              required: "You must agree to the disposal guidelines."
            }
          },


          errorPlacement: function (error, element) {
            if (element.attr("type") === "checkbox") {
              error.insertAfter(element.closest(".form-check"));
            } else {
              error.insertAfter(element);
            }
          },


          submitHandler: function (form) {
            const alertBox = $("#registerAlert");

            const firstName = $("#firstName").val().trim();
            const lastName = $("#lastName").val().trim();
            const email = $("#email").val().trim().toLowerCase();
            const password = $("#password").val();

            const defaultAdminEmail = "admin@ecocoins.ph";
            const storedUsers = JSON.parse(localStorage.getItem("ecoCoinsUsers") || "[]");


            if (email === defaultAdminEmail || storedUsers.some(function(u) { return u.email.toLowerCase() === email; })) {
              alertBox.html(`
                <div class="alert alert-warning py-2 small" role="alert">
                  <strong>Notice:</strong> An account with this email already exists. <a href="login.html" class="alert-link text-success fw-bold">Log in here</a>.
                </div>
              `);
              return false;
            }


            const newUser = {
              firstName: firstName,
              lastName: lastName,
              email: email,
              password: password
            };

            storedUsers.push(newUser);
            localStorage.setItem("ecoCoinsUsers", JSON.stringify(storedUsers));

            alertBox.html(`
              <div class="alert alert-success py-2 small" role="alert">
                <strong>Account Created!</strong> Welcome, ${firstName}! Redirecting to login...
              </div>
            `);

  
            form.reset();


            setTimeout(function () {
              window.location.href = "login.html";
            }, 1200);

            return false;
          }
        });
      });
    </script>
  </body>
</html>
